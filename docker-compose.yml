# Docker Compose for 3 Chat Bots
services:
  proxy:
    build: ./nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
  frontend:
    build: ./frontend
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      DEBUG: "false"
    volumes:
      - frontend_data:/app/data

  backend:
    build: ./backend
    expose:
      - "8001"
    env_file:
      - .env
    environment:
      DEBUG: "false"
    volumes:
      - backend_data:/app/data

volumes:
  backend_data:
  frontend_data:
