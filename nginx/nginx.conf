events {}

http {
  upstream frontend_upstream { server frontend:8000; }
  upstream backend_upstream  { server backend:8001; }

  server {
    listen 80;
    server_name 3chatbots.com www.3chatbots.com;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name 3chatbots.com www.3chatbots.com;

    ssl_certificate /etc/letsencrypt/live/3chatbots.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/3chatbots.com/privkey.pem;

    location /api/ {
      proxy_pass http://backend_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
      proxy_pass http://frontend_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}

