# fly.toml app configuration file generated for 3chatbots on 2026-05-01T15:00:45+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = '3chatbots'
primary_region = 'fra'

[build]

[env]
  PORT = '8000'

[[mounts]]
  source = 'data'
  destination = '/app/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/api/health/'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
