# Fly.io app config for 3chatbots.
# Run `fly launch --no-deploy` once to claim an app name; this file overrides the generated one.
# Bind www.3chatbots.com / 3chatbots.com via `fly certs add` after pointing Netbeat DNS at the app.

app = "3chatbots"
primary_region = "fra"

[build]

[env]
  PORT = "8000"

[[mounts]]
  source = "data"
  destination = "/app/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.checks.health]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/api/health/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
